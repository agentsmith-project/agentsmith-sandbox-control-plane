version: 1

server:
  httpPort: 8080
  requestIdHeader: X-Request-Id
  timeouts:
    readHeader: 5s
    read: 30s
    write: 60s
    idle: 120s
  maxHeaderBytes: 1048576
  metrics:
    enabled: true
    path: /metrics
  debug:
    configPath: /debug/config
    enablePprof: false

auth:
  headerName: X-Service-Key

kubernetes:
  qps: 50
  burst: 100
  requestTimeout: 15s

rateLimit:
  requestsPerMinute: 60
