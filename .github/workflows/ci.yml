name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

env:
  GO_VERSION: '1.25.6'
  IMAGE_NAME: ghcr.io/agentsmith-project/agentsmith-sandbox-control-plane

jobs:
  governance:
    name: Governance guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run quick governance checks
        run: bash scripts/verify-release.sh --quick

  image-build:
    name: Image build smoke
    runs-on: ubuntu-latest
    needs: governance
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ASBCP image without push
        uses: docker/build-push-action@v6
        with:
          context: manager-service
          file: manager-service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          build-args: |
            VERSION=ci-${{ github.sha }}

  source-tests:
    name: Source tests
    runs-on: ubuntu-latest
    needs: governance
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager-service/go.sum

      - name: Run focused source tests
        working-directory: manager-service
        run: go test -tags=short -count=1 ./...
