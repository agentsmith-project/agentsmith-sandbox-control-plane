name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.21'
  KIND_VERSION: 'v0.20.0'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        working-directory: manager-service
        run: go mod download

      - name: Run unit tests
        run: make test-unit

      - name: Generate coverage report
        run: make test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unit-tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Start test dependencies
        run: make docker-compose-up

      - name: Wait for MinIO
        run: ./scripts/wait-for-minio.sh
        env:
          TIMEOUT: 120

      - name: Run integration tests
        run: make test-integration
        env:
          MINIO_ENDPOINT: http://localhost:9000

      - name: Cleanup test dependencies
        if: always()
        run: make docker-compose-down

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64
          chmod +x ./kind

      - name: Create kind cluster
        run: ./sbx dev up --force

      - name: Build sbx-client
        run: make build-sbx-client

      - name: Run E2E tests
        run: make test-e2e
        env:
          SBX_MANAGER_HTTP_URL: http://localhost:8080
          SBX_SERVICE_KEY: test-service-key

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl logs -n sandbox-system deployment/manager-service --tail=100 || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: manager-service
