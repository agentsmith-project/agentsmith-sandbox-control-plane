name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25.6'
  IMAGE_NAME: ghcr.io/agentsmith-project/agentsmith-sandbox-control-plane
  API_CONTRACT_VERSION: v1
  BREAKING_CHANGES: Pre-GA ASBCP public release contract.

jobs:
  release:
    name: Release ASBCP image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag must be ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager-service/go.sum

      - name: Run authoritative release gate
        run: bash scripts/verify-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AgentSmith Sandbox Control Plane
            org.opencontainers.image.description=ASBCP sandbox workload lifecycle service

      - name: Build and push ASBCP image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: manager-service
          file: manager-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}

      - name: Verify digest pull
        run: docker pull "${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}"

      - name: Verify anonymous digest pull
        id: public_inspect
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}"
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${image_ref}" >/tmp/asbcp-public-manifest.json
          echo "result=ok" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Generate final manifest
        shell: bash
        env:
          ASBCP_VERSION: ${{ steps.version.outputs.version }}
          ASBCP_TAG: ${{ steps.version.outputs.image_tag }}
          ASBCP_IMAGE_REF: ${{ steps.public_inspect.outputs.image_ref }}
          ASBCP_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLIC_INSPECT_RESULT: ${{ steps.public_inspect.outputs.result }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "version": os.environ["ASBCP_VERSION"],
              "tag": os.environ["ASBCP_TAG"],
              "commit": os.environ["GITHUB_SHA"],
              "image_ref": os.environ["ASBCP_IMAGE_REF"],
              "image_digest": os.environ["ASBCP_IMAGE_DIGEST"],
              "api_contract_version": os.environ["API_CONTRACT_VERSION"],
              "public_inspect_result": os.environ["PUBLIC_INSPECT_RESULT"],
              "release_gate": "scripts/verify-release.sh",
              "breaking_changes": os.environ["BREAKING_CHANGES"],
          }

          manifest_path = Path("dist/asbcp-final-manifest.json")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          notes = f"""## ASBCP Release

          Version: {manifest["tag"]}
          Commit SHA: {manifest["commit"]}
          API contract version: {manifest["api_contract_version"]}
          Image digest: `{manifest["image_ref"]}`
          Public inspect result: {manifest["public_inspect_result"]}
          Final manifest: `asbcp-final-manifest.json`
          Breaking changes: {manifest["breaking_changes"]}

          AgentSmith lock:
          ```text
          asbcp_version={manifest["tag"]}
          asbcp_source_image={manifest["image_ref"]}
          asbcp_release_url=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/tag/{manifest["tag"]}
          asbcp_commit_sha={manifest["commit"]}
          ```

          Release readiness was evaluated by `{manifest["release_gate"]}`.
          """
          Path("dist/asbcp-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/asbcp-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/asbcp-final-manifest.json
