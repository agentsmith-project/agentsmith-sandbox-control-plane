name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25.6'
  IMAGE_NAME: ghcr.io/agentsmith-project/agentsmith-sandbox-control-plane

jobs:
  release:
    name: Release ASBCP image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag must be ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager-service/go.sum

      - name: Run authoritative release gate
        run: bash scripts/verify-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AgentSmith Sandbox Control Plane
            org.opencontainers.image.description=ASBCP sandbox workload lifecycle service

      - name: Build and push ASBCP image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: manager-service
          file: manager-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}

      - name: Verify anonymous digest pull
        id: anonymous_pull
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}"
          build_push_digest="${{ steps.build.outputs.digest }}"
          image_ref="${tag_ref}@${build_push_digest}"
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker pull "${tag_ref}"
          tag_repo_digest="$(DOCKER_CONFIG="${tmp_docker_config}" docker image inspect "${tag_ref}" --format '{{ index .RepoDigests 0 }}')"
          tag_resolved_digest="${tag_repo_digest##*@}"
          DOCKER_CONFIG="${tmp_docker_config}" docker pull "${image_ref}"
          anonymous_repo_digest="$(DOCKER_CONFIG="${tmp_docker_config}" docker image inspect "${image_ref}" --format '{{ index .RepoDigests 0 }}')"
          anonymous_digest="${anonymous_repo_digest##*@}"
          if [ "${tag_resolved_digest}" != "${build_push_digest}" ] || [ "${anonymous_digest}" != "${build_push_digest}" ]; then
            echo "Anonymous digest proof mismatch: tag=${tag_resolved_digest}, build=${build_push_digest}, anonymous=${anonymous_digest}" >&2
            exit 1
          fi
          {
            echo "result=ok"
            echo "tag_ref=${tag_ref}"
            echo "image_ref=${image_ref}"
            echo "tag_resolved_digest=${tag_resolved_digest}"
            echo "build_push_digest=${build_push_digest}"
            echo "anonymous_digest=${anonymous_digest}"
            echo "same_digest_match=true"
            echo "docker_config=fresh-empty"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate final manifest
        shell: bash
        env:
          ASBCP_VERSION: ${{ steps.version.outputs.image_tag }}
          ASBCP_GIT_TAG: ${{ steps.version.outputs.image_tag }}
          ASBCP_TAG_REF: ${{ steps.anonymous_pull.outputs.tag_ref }}
          ASBCP_IMAGE_REF: ${{ steps.anonymous_pull.outputs.image_ref }}
          ASBCP_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ANONYMOUS_PULL_RESULT: ${{ steps.anonymous_pull.outputs.result }}
          TAG_RESOLVED_DIGEST: ${{ steps.anonymous_pull.outputs.tag_resolved_digest }}
          ANONYMOUS_DIGEST: ${{ steps.anonymous_pull.outputs.anonymous_digest }}
          SAME_DIGEST_MATCH: ${{ steps.anonymous_pull.outputs.same_digest_match }}
          ANONYMOUS_DOCKER_CONFIG: ${{ steps.anonymous_pull.outputs.docker_config }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/generate-final-manifest \
            --output dist/asbcp-final-manifest.json \
            --release-notes-output dist/asbcp-release-notes.md \
            --changelog-evidence-json dist/asbcp-changelog-evidence.json \
            --risk-status-json dist/asbcp-risk-status.json \
            --api-contract-version dist/asbcp-api-contract-version.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/asbcp-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/asbcp-final-manifest.json
