name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25.6'
  IMAGE_NAME: ghcr.io/agentsmith-project/agentsmith-sandbox-control-plane
  API_CONTRACT_VERSION: v1

jobs:
  release:
    name: Release ASBCP image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag must be ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager-service/go.sum

      - name: Run authoritative release gate
        run: bash scripts/verify-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AgentSmith Sandbox Control Plane
            org.opencontainers.image.description=ASBCP sandbox workload lifecycle service

      - name: Build and push ASBCP image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: manager-service
          file: manager-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}

      - name: Verify anonymous digest pull
        id: anonymous_pull
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}"
          build_push_digest="${{ steps.build.outputs.digest }}"
          image_ref="${tag_ref}@${build_push_digest}"
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker pull "${tag_ref}"
          tag_repo_digest="$(DOCKER_CONFIG="${tmp_docker_config}" docker image inspect "${tag_ref}" --format '{{ index .RepoDigests 0 }}')"
          tag_resolved_digest="${tag_repo_digest##*@}"
          DOCKER_CONFIG="${tmp_docker_config}" docker pull "${image_ref}"
          anonymous_repo_digest="$(DOCKER_CONFIG="${tmp_docker_config}" docker image inspect "${image_ref}" --format '{{ index .RepoDigests 0 }}')"
          anonymous_digest="${anonymous_repo_digest##*@}"
          if [ "${tag_resolved_digest}" != "${build_push_digest}" ] || [ "${anonymous_digest}" != "${build_push_digest}" ]; then
            echo "Anonymous digest proof mismatch: tag=${tag_resolved_digest}, build=${build_push_digest}, anonymous=${anonymous_digest}" >&2
            exit 1
          fi
          {
            echo "result=ok"
            echo "tag_ref=${tag_ref}"
            echo "image_ref=${image_ref}"
            echo "tag_resolved_digest=${tag_resolved_digest}"
            echo "build_push_digest=${build_push_digest}"
            echo "anonymous_digest=${anonymous_digest}"
            echo "same_digest_match=true"
            echo "docker_config=fresh-empty"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate final manifest
        shell: bash
        env:
          ASBCP_VERSION: ${{ steps.version.outputs.image_tag }}
          ASBCP_GIT_TAG: ${{ steps.version.outputs.image_tag }}
          ASBCP_TAG_REF: ${{ steps.anonymous_pull.outputs.tag_ref }}
          ASBCP_IMAGE_REF: ${{ steps.anonymous_pull.outputs.image_ref }}
          ASBCP_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ANONYMOUS_PULL_RESULT: ${{ steps.anonymous_pull.outputs.result }}
          TAG_RESOLVED_DIGEST: ${{ steps.anonymous_pull.outputs.tag_resolved_digest }}
          ANONYMOUS_DIGEST: ${{ steps.anonymous_pull.outputs.anonymous_digest }}
          SAME_DIGEST_MATCH: ${{ steps.anonymous_pull.outputs.same_digest_match }}
          ANONYMOUS_DOCKER_CONFIG: ${{ steps.anonymous_pull.outputs.docker_config }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/verify-release.sh --changelog-evidence-json "${ASBCP_GIT_TAG}" > dist/asbcp-changelog-evidence.json
          bash scripts/verify-release.sh --risk-status-json > dist/asbcp-risk-status.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          commit_sha = os.environ["GITHUB_SHA"]
          release_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['ASBCP_GIT_TAG']}"
          runbook_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{commit_sha}/docs/runbooks/release.md"
          tag_resolved_digest = os.environ["TAG_RESOLVED_DIGEST"]
          build_push_digest = os.environ["ASBCP_IMAGE_DIGEST"]
          anonymous_digest = os.environ["ANONYMOUS_DIGEST"]
          same_digest_match = (
              os.environ["SAME_DIGEST_MATCH"].lower() == "true"
              and tag_resolved_digest == build_push_digest == anonymous_digest
          )
          changelog_evidence = json.loads(Path("dist/asbcp-changelog-evidence.json").read_text(encoding="utf-8"))
          if changelog_evidence["tag"] != os.environ["ASBCP_GIT_TAG"]:
              raise SystemExit("CHANGELOG evidence tag must match ASBCP_GIT_TAG")
          risk_status_evidence = json.loads(Path("dist/asbcp-risk-status.json").read_text(encoding="utf-8"))
          if risk_status_evidence["blocking_risks"]:
              raise SystemExit("release-blocking risks remain: " + ", ".join(risk_status_evidence["blocking_risks"]))

          known_breaking_changes_json = json.dumps(changelog_evidence["known_breaking_changes"], ensure_ascii=False)
          release_body = f"""## ASBCP Release

          Version: {os.environ["ASBCP_VERSION"]}
          Git tag: {os.environ["ASBCP_GIT_TAG"]}
          Commit SHA: {commit_sha}
          API contract version: {os.environ["API_CONTRACT_VERSION"]}
          Image ref: `{os.environ["ASBCP_IMAGE_REF"]}`
          Image digest: `{build_push_digest}`
          Anonymous pull: {os.environ["ANONYMOUS_PULL_RESULT"]} with {os.environ["ANONYMOUS_DOCKER_CONFIG"]} Docker config
          Tag resolved digest: `{tag_resolved_digest}`
          Build-push digest: `{build_push_digest}`
          Anonymous digest: `{anonymous_digest}`
          Same digest proof: {same_digest_match}
          Final manifest: `asbcp-final-manifest.json`
          Breaking changes: {known_breaking_changes_json}
          Changelog summary: {changelog_evidence["changelog_summary"]}
          Known risk status: {risk_status_evidence["known_risk_status"]}
          Known risk status source: {risk_status_evidence["source"]}
          Runbook: {runbook_url}

          Downstream image lock values:
          ```text
          asbcp_version={os.environ["ASBCP_VERSION"]}
          asbcp_source_image={os.environ["ASBCP_IMAGE_REF"]}
          asbcp_release_url={release_url}
          asbcp_commit_sha={commit_sha}
          ```

          Release readiness was evaluated by `scripts/verify-release.sh`.
          """
          manifest = {
              "schema_id": "https://agentsmith.dev/schemas/asbcp/final-manifest.v1.json",
              "asbcp_version": os.environ["ASBCP_VERSION"],
              "git_tag": os.environ["ASBCP_GIT_TAG"],
              "commit_sha": commit_sha,
              "image_ref": os.environ["ASBCP_IMAGE_REF"],
              "image_digest": os.environ["ASBCP_IMAGE_DIGEST"],
              "api_contract_version": os.environ["API_CONTRACT_VERSION"],
              "anonymous_pull": {
                  "result": os.environ["ANONYMOUS_PULL_RESULT"],
                  "tag_ref": os.environ["ASBCP_TAG_REF"],
                  "image_ref": os.environ["ASBCP_IMAGE_REF"],
                  "tag_resolved_digest": tag_resolved_digest,
                  "build_push_digest": build_push_digest,
                  "anonymous_digest": anonymous_digest,
                  "docker_config": os.environ["ANONYMOUS_DOCKER_CONFIG"],
                  "commands": [
                      f"DOCKER_CONFIG=<fresh-empty> docker pull {os.environ['ASBCP_TAG_REF']}",
                      f"DOCKER_CONFIG=<fresh-empty> docker pull {os.environ['ASBCP_IMAGE_REF']}",
                  ],
              },
              "same_digest_proof": {
                  "tag_resolved_digest": tag_resolved_digest,
                  "build_push_digest": build_push_digest,
                  "anonymous_digest": anonymous_digest,
                  "matches": same_digest_match,
                  "source": "fresh-empty Docker config docker pull image:tag and image:tag@build_push_digest",
              },
              "known_breaking_changes": changelog_evidence["known_breaking_changes"],
              "changelog_summary": changelog_evidence["changelog_summary"],
              "known_risk_status": risk_status_evidence["known_risk_status"],
              "known_risk_status_source": risk_status_evidence["source"],
              "runbook_url": runbook_url,
              "release_notes": {
                  "body_source": release_body,
                  "github_release_url": release_url,
              },
              "release_gate": "scripts/verify-release.sh",
          }
          if not manifest["same_digest_proof"]["matches"]:
              raise SystemExit("same_digest_proof.matches must be true")

          manifest_path = Path("dist/asbcp-final-manifest.json")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("dist/asbcp-release-notes.md").write_text(manifest["release_notes"]["body_source"], encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/asbcp-release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/asbcp-final-manifest.json
