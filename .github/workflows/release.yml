name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.25.6'
  IMAGE_NAME: ghcr.io/agentsmith-project/agentsmith-sandbox-control-plane
  API_CONTRACT_VERSION: v1
  BREAKING_CHANGES: Pre-GA ASBCP public release contract.

jobs:
  release:
    name: Release ASBCP image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag must be ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: manager-service/go.sum

      - name: Run authoritative release gate
        run: bash scripts/verify-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=AgentSmith Sandbox Control Plane
            org.opencontainers.image.description=ASBCP sandbox workload lifecycle service

      - name: Build and push ASBCP image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: manager-service
          file: manager-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}

      - name: Verify digest pull
        run: docker pull "${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}"

      - name: Verify anonymous digest pull
        shell: bash
        run: |
          set -euo pipefail
          tmp_docker_config="$(mktemp -d)"
          trap 'rm -rf "${tmp_docker_config}"' EXIT
          DOCKER_CONFIG="${tmp_docker_config}" docker manifest inspect "${IMAGE_NAME}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}" >/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## ASBCP Release

            Version: ${{ steps.version.outputs.image_tag }}
            Commit SHA: ${{ github.sha }}
            API contract version: ${{ env.API_CONTRACT_VERSION }}
            Image digest: `${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}`
            Breaking changes: ${{ env.BREAKING_CHANGES }}

            AgentSmith lock:
            ```text
            asbcp_version=${{ steps.version.outputs.image_tag }}
            asbcp_source_image=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}@${{ steps.build.outputs.digest }}
            asbcp_release_url=https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.image_tag }}
            asbcp_commit_sha=${{ github.sha }}
            ```

            Release readiness was evaluated by `scripts/verify-release.sh`.
