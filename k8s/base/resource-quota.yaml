apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: sandbox
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    default:
      cpu: "1"
      memory: "1Gi"
      ephemeral-storage: "2Gi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: sandbox
spec:
  hard:
    pods: "200"
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "200"
    limits.memory: "200Gi"
    requests.ephemeral-storage: "200Gi"
    limits.ephemeral-storage: "400Gi"
