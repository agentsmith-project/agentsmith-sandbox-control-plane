apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-manager-config
  namespace: sandbox-system
data:
  manager-config.yaml: |-
    version: 1

    server:
      httpPort: 8080
      requestIdHeader: X-Request-Id
      timeouts:
        readHeader: 5s
        read: 30s
        write: 60s
        idle: 120s
      maxHeaderBytes: 1048576
      metrics:
        enabled: true
        path: /metrics
      debug:
        configPath: /debug/config
        enablePprof: false

    kubernetes:
      qps: 50
      burst: 100
      requestTimeout: 15s

    sandbox:
      defaults:
        namespace: sandbox-workloads

    auth:
      headerName: X-Service-Key

    rateLimit:
      requestsPerMinute: 60
