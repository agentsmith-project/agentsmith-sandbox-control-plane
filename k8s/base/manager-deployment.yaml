apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  namespace: sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-manager
  template:
    metadata:
      labels:
        app: sandbox-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sandbox-manager
      # imagePullSecrets 在 overlays 中根据环境配置
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: sandbox-manager:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # Boot configuration (not hot-reloadable)
        - name: CONFIG_PATH
          value: "/etc/sandbox-manager/manager-config.yaml"
        - name: CONFIG_RELOAD_DEBOUNCE
          value: "300ms"
        - name: CONFIG_RELOAD_MIN_INTERVAL
          value: "1s"
        - name: CONFIG_RELOAD_BACKOFF_MAX
          value: "30s"
        - name: STRICT_CONFIG_RELOAD
          value: "false"
        - name: DEBUG
          value: "false"
        - name: RUNNER_IMAGE_DEFAULT
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: runner-image-default
        # Storage configuration
        # Option 1: Use credentials from mounted Secret (recommended for production)
        - name: STORAGE_CREDENTIALS_PATH
          value: "/etc/secrets/minio"
        # Option 2: Use environment variables (fallback for local development)
        # STORAGE_ENDPOINT: overridden per overlay (dev, staging, production)
        - name: STORAGE_ENDPOINT
          value: "minio.sandbox-system.svc.cluster.local:9000"
        - name: STORAGE_BUCKET
          value: "sandboxes"
        - name: STORAGE_USE_SSL
          value: "false"
        # Mount config file
        volumeMounts:
        - name: manager-config
          mountPath: /etc/sandbox-manager/manager-config.yaml
          subPath: manager-config.yaml
          readOnly: true
        # Mount MinIO credentials (Secret volume)
        - name: minio-credentials
          mountPath: /etc/secrets/minio
          readOnly: true
        # Probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        # Resources
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        # Security
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
      # Volumes
      volumes:
      - name: manager-config
        configMap:
          name: sandbox-manager-config
      - name: minio-credentials
        secret:
          secretName: minio-credentials
          defaultMode: 0400  # Read-only, owner only
