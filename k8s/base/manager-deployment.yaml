apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  namespace: sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sandbox-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sandbox-manager
      # imagePullSecrets 在 overlays 中根据环境配置
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: sandbox-manager:2.0.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # Boot configuration
        - name: CONFIG_PATH
          value: "/etc/sandbox-manager/manager-config.yaml"
        - name: DEBUG
          value: "false"
        - name: SERVICE_KEYS
          valueFrom:
            secretKeyRef:
              name: sandbox-manager-secrets
              key: service-keys
        - name: K8S_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: workload-namespace
        # AFSCP workload mount plan client
        - name: AFSCP_INTERNAL_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: afscp-internal-base-url
        - name: AFSCP_ORCHESTRATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: sandbox-manager-secrets
              key: afscp-orchestrator-token
        - name: AFSCP_CALLER_SERVICE
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: afscp-caller-service
        - name: AFSCP_ACTOR_TYPE
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: afscp-actor-type
        - name: AFSCP_ACTOR_ID
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: afscp-actor-id
        # CSI materialization knobs; backend auth and payload subdir come only from AFSCP plans.
        - name: JUICEFS_CSI_DRIVER
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: juicefs-csi-driver
        - name: JUICEFS_STORAGE_CAPACITY
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: juicefs-storage-capacity
        - name: JUICEFS_STORAGE_CLASS_NAME
          valueFrom:
            configMapKeyRef:
              name: sandbox-config
              key: juicefs-storage-class-name
        # Mount config file
        volumeMounts:
        - name: manager-config
          mountPath: /etc/sandbox-manager/manager-config.yaml
          subPath: manager-config.yaml
          readOnly: true
        # Probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        # Resources
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        # Security
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
      # Volumes
      volumes:
      - name: manager-config
        configMap:
          name: sandbox-manager-config
