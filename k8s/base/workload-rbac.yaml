apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-pod-manager
  namespace: sandbox-workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-pod-manager-binding
  namespace: sandbox-workloads
subjects:
  - kind: ServiceAccount
    name: agentsmith-sandbox-control-plane
    namespace: sandbox-system
roleRef:
  kind: Role
  name: workload-pod-manager
  apiGroup: rbac.authorization.k8s.io
