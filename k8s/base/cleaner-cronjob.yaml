apiVersion: batch/v1
kind: CronJob
metadata:
  name: sandbox-cleaner
  namespace: sandbox-system
  labels:
    app: sandbox-cleaner
spec:
  # Run every 5 minutes
  schedule: "*/5 * * * *"
  # Only one job at a time
  concurrencyPolicy: Forbid
  # Keep successful jobs for 1 hour, failed jobs for 1 day
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 3
  # Job deadline
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        app: sandbox-cleaner
    spec:
      # Automatically clean up completed pods after 5 minutes
      ttlSecondsAfterFinished: 300
      # Restart policy for the pod
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: sandbox-cleaner
        spec:
          serviceAccountName: sandbox-manager
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: cleaner
            image: sandbox-manager:2.0.0
            imagePullPolicy: IfNotPresent
            command:
            - /cleaner
            # Flags for namespace and other options
            args:
            - --namespace=sandbox-system
            - --namespace=sandbox-workspaces
            - --log-level=info
            env:
            # Service keys from Secret (for authentication)
            - name: SERVICE_KEYS
              valueFrom:
                secretKeyRef:
                  name: sandbox-manager-keys
                  key: SERVICE_KEYS
            # Boot configuration
            - name: CONFIG_PATH
              value: "/etc/sandbox-manager/manager-config.yaml"
            - name: DEBUG
              value: "false"
            # Mount config file
            volumeMounts:
            - name: manager-config
              mountPath: /etc/sandbox-manager/manager-config.yaml
              subPath: manager-config.yaml
              readOnly: true
            # Resources - cleaner typically needs less resources
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "256Mi"
            # Security
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
          # Volumes
          volumes:
          - name: manager-config
            configMap:
              name: sandbox-manager-config
