# K8s Secret for MinIO/S3 credentials
# This secret should be created in the same namespace as the manager deployment
#
# Usage:
#   kubectl apply -f k8s/base/minio-secret.yaml
#
# Or create directly:
#   kubectl create secret generic minio-credentials \
#     --from-literal=access.key="${MINIO_ACCESS_KEY}" \
#     --from-literal=secret.key="${MINIO_SECRET_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: sandbox-system
type: Opaque
stringData:
  # These values should be replaced with actual credentials
  # For production, use kubectl create secret generic or external secret operators
  access.key: "minioadmin"
  secret.key: "minioadmin"
