apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 注意：不设置全局 namespace，因为不同资源在不同 namespace
# namespace: sandbox-system

# 资源文件（按依赖顺序）
resources:
  - namespaces.yaml
  - resource-quota.yaml
  - configmap.yaml
  - asbcp-configmap.yaml
  - rbac-asbcp.yaml
  - workload-rbac.yaml
  - asbcp-deployment.yaml
  - asbcp-service.yaml
  - workload-networkpolicy.yaml

# 通用标签。不要写入 selectors：workload pods 由 ASBCP 动态创建，
# selector 必须只匹配 runtime 真实写入的 label。
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: agentsmith-sandbox-control-plane
      app.kubernetes.io/component: asbcp
      app.kubernetes.io/managed-by: kustomize

# 镜像替换（在 overlays 中覆盖）
# Base 中只定义镜像名称，不包含 registry，由 overlays 指定完整路径
images:
  - name: agentsmith-sandbox-control-plane
    newName: agentsmith-sandbox-control-plane
    newTag: "2.0.10"

# 通用注解
commonAnnotations:
  app.kubernetes.io/version: "2.0.10"
