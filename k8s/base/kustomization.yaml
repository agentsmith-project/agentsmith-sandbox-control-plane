apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 注意：不设置全局 namespace，因为不同资源在不同 namespace
# namespace: sandbox-system

# 资源文件（按依赖顺序）
resources:
  - namespaces.yaml
  - resource-quota.yaml
  - configmap.yaml
  - manager-configmap.yaml
  - manager-secret.yaml
  - rbac-manager.yaml
  - manager-deployment.yaml
  - manager-service.yaml
  - network-policy.yaml
  - rbac-gc.yaml
  - gc-cronjob.yaml
  - cleaner-cronjob.yaml

# 通用标签
commonLabels:
  app.kubernetes.io/name: sandbox
  app.kubernetes.io/component: sandbox-system
  app.kubernetes.io/managed-by: kustomize

# 镜像替换（在 overlays 中覆盖）
# Base 中只定义镜像名称，不包含 registry，由 overlays 指定完整路径
images:
  - name: sandbox-manager
    newName: sandbox-manager
    newTag: "2.0.0"
  - name: sandbox-runner
    newName: sandbox-runner
    newTag: "1.0.0"
  - name: sandbox-gc
    newName: sandbox-gc
    newTag: "1.0.0"

# 通用注解
commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
