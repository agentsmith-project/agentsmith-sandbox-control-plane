apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsmith-sandbox-control-plane
  namespace: sandbox-system
  labels:
    app.kubernetes.io/component: asbcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentsmith-sandbox-control-plane
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: agentsmith-sandbox-control-plane
        app.kubernetes.io/component: asbcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentsmith-sandbox-control-plane
      # imagePullSecrets 在 overlays 中根据环境配置
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: asbcp
        image: agentsmith-sandbox-control-plane:2.0.16
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # Boot configuration
        - name: ASBCP_CONFIG_PATH
          value: "/etc/asbcp/asbcp-config.yaml"
        - name: DEBUG
          value: "false"
        - name: ASBCP_SERVICE_KEYS
          valueFrom:
            secretKeyRef:
              name: agentsmith-sandbox-control-plane-secrets
              key: service-keys
        - name: ASBCP_WORKLOAD_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: workload-namespace
        # AFSCP workload mount plan client
        - name: ASBCP_AFSCP_INTERNAL_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: afscp-internal-base-url
        - name: ASBCP_AFSCP_ORCHESTRATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentsmith-sandbox-control-plane-secrets
              key: afscp-orchestrator-token
        - name: ASBCP_AFSCP_CALLER_SERVICE
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: afscp-caller-service
        - name: ASBCP_AFSCP_ACTOR_TYPE
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: afscp-actor-type
        - name: ASBCP_AFSCP_ACTOR_ID
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: afscp-actor-id
        # CSI materialization knobs; backend auth and payload subdir come only from AFSCP plans.
        - name: ASBCP_JUICEFS_CSI_DRIVER
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: juicefs-csi-driver
        - name: ASBCP_JUICEFS_STORAGE_CAPACITY
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: juicefs-storage-capacity
        - name: ASBCP_JUICEFS_STORAGE_CLASS_NAME
          valueFrom:
            configMapKeyRef:
              name: asbcp-runtime-config
              key: juicefs-storage-class-name
        # Mount config file
        volumeMounts:
        - name: asbcp-config
          mountPath: /etc/asbcp/asbcp-config.yaml
          subPath: asbcp-config.yaml
          readOnly: true
        # Probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        # Resources
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        # Security
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
      # Volumes
      volumes:
      - name: asbcp-config
        configMap:
          name: asbcp-config
