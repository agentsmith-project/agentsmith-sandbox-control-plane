apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsmith-sandbox-control-plane
  namespace: sandbox-system
spec:
  template:
    spec:
      containers:
      - name: asbcp
        imagePullPolicy: Always  # 生产环境总是拉取最新镜像
        securityContext:
          readOnlyRootFilesystem: false  # Manager 可能需要写入
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
